# dsh-browser bundle layer: one host-plane browser SERVICE plus the model-facing
# browser_* tools. Both rows reference this package by NAME (not a relative path)
# so Node resolves the installed code through the profile's module fallback.

- insert:
    # Shared Playwright browser process. One instance serves every session;
    # per-agent BrowserContexts keep each conversation's tabs and login isolated.
    - id: browser
      name: dsh-browser
      config:
        channel: msedge
        headless: false

    # The model-facing tools. They resolve the host `browser` service and
    # register into the host `tools` registry; both live in the host plane here
    # so installing this bundle is all a user needs to enable browser automation.
    - id: tool-browser
      name: dsh-browser/tool
